<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindSpace - 30 Day Free Trial</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen">
<div class="max-w-3xl mx-auto p-6">
  <h1 class="text-3xl font-bold">MindSpace 🧠</h1>
  <p class="text-gray-400">By Growth Guides - 30 Days FREE Trial</p>

  <!-- TRIAL BANNER -->
  <div id="trialBanner" class="mt-6 p-3 bg-blue-900/40 rounded-xl text-sm text-center hidden"></div>

  <!-- PAYWALL (shown after 30 days) -->
  <div id="paywall" class="hidden mt-10 p-8 bg-zinc-900 rounded-2xl text-center">
    <h2 class="text-2xl font-bold">Your 30-Day Trial Ended</h2>
    <p class="mt-3 text-gray-400">You loved MindSpace? Continue for just Rs. 49 Lifetime</p>
    <button id="payBtn" class="mt-6 w-full bg-white text-black py-4 rounded-xl font-bold">Pay Rs. 49 & Continue</button>
    <p class="mt-2 text-xs text-gray-500">One-time payment • Lifetime access</p>
  </div>

  <!-- APP -->
  <div id="app" class="mt-8">
    <div id="chatBox" class="h-96 overflow-y-auto p-4 bg-zinc-900 rounded-xl space-y-3">
      <div class="bg-zinc-800 px-4 py-3 rounded-xl">Hi! I'm your MindSpace AI Mentor. Ask any doubt - DSA, Web Dev, Career, Motivation. How can I help today?</div>
    </div>
    <div class="mt-4 flex gap-2">
      <input id="userInput" placeholder="Ask your doubt..." class="flex-1 p-4 rounded-xl bg-zinc-900 border border-zinc-800 outline-none">
      <button id="sendBtn" class="px-6 bg-white text-black rounded-xl font-bold">Send</button>
    </div>
  </div>
</div>

<script>
const TRIAL_DAYS = 30;
const KEY_START = "ms_trial_start";
const KEY_PAID = "ms_paid";

let start = localStorage.getItem(KEY_START);
if(!start){ start = new Date().toISOString(); localStorage.setItem(KEY_START, start); }

const daysUsed = Math.floor((new Date() - new Date(start)) / (1000*60*60*24));
const daysLeft = TRIAL_DAYS - daysUsed;
const isPaid = localStorage.getItem(KEY_PAID) === "true";

const banner = document.getElementById("trialBanner");
const paywall = document.getElementById("paywall");
const app = document.getElementById("app");

if(isPaid){
  banner.innerHTML = "✅ Lifetime Access Unlocked"; banner.classList.remove("hidden");
} else if(daysLeft > 0){
  banner.innerHTML = `🎉 Free Trial: ${daysLeft} days left • Enjoy full access`;
  banner.classList.remove("hidden");
  paywall.classList.add("hidden"); app.classList.remove("hidden");
} else {
  banner.innerHTML = "⏰ Trial Ended"; banner.classList.remove("hidden");
  paywall.classList.remove("hidden"); app.classList.add("hidden");
}

// For testing: Add ?paid=true after payment
if(window.location.search.includes("paid=true")){
  localStorage.setItem(KEY_PAID, "true"); location.href = location.pathname;
}
document.getElementById("payBtn").onclick = () => {
  // For now free - after 30 days we add Razorpay link here
  alert("Payment integration - we will add Razorpay link here in Step 4 after you get users. For now type: localStorage.setItem('ms_paid','true') in console to unlock for testing");
};

// CHAT
const chatBox = document.getElementById("chatBox"); const input = document.getElementById("userInput");
async function sendMsg(){
  const text = input.value.trim(); if(!text) return;
  chatBox.innerHTML += `<div class="text-right"><div class="inline-block bg-white text-black px-4 py-2 rounded-xl">${text}</div></div>`;
  input.value = ""; const id = "l"+Date.now();
  chatBox.innerHTML += `<div id="${id}" class="text-gray-500 text-sm">Thinking...</div>`;
  chatBox.scrollTop = chatBox.scrollHeight;
  try{
    const res = await fetch("/api/mentor", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({message: text})});
    const data = await res.json();
    document.getElementById(id)?.remove();
    chatBox.innerHTML += `<div><div class="inline-block bg-zinc-800 px-4 py-3 rounded-xl whitespace-pre-wrap">${data.reply}</div></div>`;
  }catch(e){
    document.getElementById(id)?.remove();
    chatBox.innerHTML += `<div class="text-red-400 text-sm">AI not connected yet. We will fix in Step 3 with API key.</div>`;
  }
  chatBox.scrollTop = chatBox.scrollHeight;
}
document.getElementById("sendBtn").onclick = sendMsg;
input.addEventListener("keydown", e=>{if(e.key==="Enter") sendMsg();});
</script>
</body>
</html>
